<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(circle, #2a2d32 0%, #111315 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            padding: 40px 20px;
        }

        .logo {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #a0aec0;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        /* Decorative animated accent bar */
        .accent-bar {
            height: 4px;
            width: 100px;
            background: linear-gradient(90deg, #ff5e62, #ff9966);
            margin: 0 auto 30px auto;
            border-radius: 2px;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5e0;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Subscription Form */
        .notify-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .notify-form {
                flex-direction: row;
                gap: 0;
                background: rgba(255, 255, 255, 0.05);
                padding: 6px;
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        input[type="email"] {
            padding: 15px 20px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
        }

        @media (min-width: 480px) {
            input[type="email"] {
                background: transparent;
                border: none;
                flex-grow: 1;
            }
        }

        input[type="email"]:focus {
            border-color: #ff9966;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff5e62, #ff9966);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            width: 100%;
        }

        @media (min-width: 480px) {
            button {
                width: auto;
            }
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">SLGK</div>
        <h1>Under Construction</h1>
        <div class="accent-bar"></div>
        <p>Our website is currently undergoing scheduled maintenance and upgrades. We will be back online shortly with an all-new experience!</p>

    </div>

</body>
</html>
